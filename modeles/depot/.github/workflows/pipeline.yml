# =====================================================================
# Le pipeline standard d'une application — engendré depuis
# Infra-server/modeles/depot par « outils/nouveau-depot.sh ».
#
#   pull request vers main ──▶ verifier            (jamais de déploiement)
#   push sur main          ──▶ verifier ──▶ deployer (workflow réutilisable
#                                                     d'Infra-server)
#
# La partie `verifier` est À VOUS : vos tests, votre lint, vos bancs. La
# partie `deployer` est COMMUNE : ne pas la réécrire, l'appeler.
# =====================================================================
name: pipeline

on:
  push:
    branches: [main]
  # Sur `refs/pull/N/merge` : la FUSION avec main, pas la tête de la branche.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployer:
        description: "Mettre en service après les contrôles (main seulement)"
        type: boolean
        default: false

permissions:
  contents: read

# Sur main, un passage ne s'annule jamais (il pourrait être en train de
# déployer) ; ailleurs, la poussée suivante annule la précédente.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ------------------------------------------------------------ À VOUS
  serveur:
    name: Le serveur — tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic
      - name: Tests (et le jar se bâtit)
        working-directory: __BACKEND__
        run: ./gradlew build --no-daemon --console=plain

  # >>> ecran
  ecran:
    name: L'écran — lint et livrable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: __FRONTEND__/package-lock.json
      - working-directory: __FRONTEND__
        # Le lint est BLOQUANT : un « || true » qui laisse tout passer n'est
        # pas un contrôle (défaut relevé sur Purchase_Management).
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
  # <<< ecran

  # ------------------------------------------------------------ COMMUN
  deployer:
    needs: [__NEEDS__]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deployer)
    uses: EntrepriseTools/Infra-server/.github/workflows/deployer.yml@v1
    with:
      application: __APP__
      contexte: __CONTEXTE__
      frontend: "__FRONTEND_SPA__"
      url-publique: ${{ vars.URL_PUBLIQUE }}
    secrets: inherit
