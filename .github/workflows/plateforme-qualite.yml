# =====================================================================
# La QUALITÉ de la plateforme Kubernetes, sur chaque PR et chaque push :
# rien n'entre dans `main` sans être formaté, validé, testé et scanné.
#
#   terraform   fmt · validate · test (providers simulés) · tflint
#   helm        lint · unittest · template | kubeconform (schémas stricts)
#   securite    trivy (mauvaises configurations + secrets) · zizmor (workflows)
#   scripts     shellcheck des scripts d'amorçage
#
# Aucun de ces travaux ne touche au cluster : aucun secret n'est utilisé.
# Le plan Terraform contre le vrai cluster est dans plateforme-terraform.yml.
#
# Sécurité de la CI elle-même :
#  - chaque action tierce est ÉPINGLÉE par son SHA de commit (une étiquette
#    se déplace : en mars 2026, les étiquettes de trivy-action ont été
#    réécrites pour voler des secrets de CI) ; Renovate les met à jour ;
#  - les binaires téléchargés sont vérifiés par leur somme SHA-256 ÉCRITE ICI ;
#  - permissions minimales, et persist-credentials: false.
# =====================================================================
name: plateforme · qualité

on:
  # Sur TOUTES les PR (pas de filtre de chemins) : le travail « garde »
  # ci-dessous peut ainsi être rendu OBLIGATOIRE dans les règles de `main`
  # — un contrôle filtré par chemins resterait « en attente » pour toujours
  # sur une PR qui ne touche pas ces chemins.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "plateforme/**"
      - "gitops/**"
      - ".github/workflows/plateforme-*.yml"
      - ".github/workflows/k8s-publier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plateforme-qualite-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.16.4"
  HELM_VERSION: "v3.22.0"
  KUBECONFORM_VERSION: "v0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
  KUBERNETES_VERSION: "1.36.0"

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plateforme/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: fmt (le style est vérifié, pas discuté)
        run: terraform fmt -check -recursive -diff

      - name: module espace-application — validate et tests
        working-directory: plateforme/terraform/modules/espace-application
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: module racine — validate et tests
        working-directory: plateforme/terraform/plateforme
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  helm:
    name: helm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: kubeconform (somme vérifiée)
        run: |
          curl -sSfL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          sudo tar xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform

      - name: helm lint (valeurs par défaut et cas de CI)
        run: |
          helm lint plateforme/helm/socle --strict
          for f in plateforme/helm/application/ci/*.yaml; do
            helm lint plateforme/helm/application --strict -f "$f"
          done

      - name: helm unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2
          helm unittest plateforme/helm/application

      - name: rendu → kubeconform (schémas Kubernetes et CRD, mode strict)
        run: |
          KC=(kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}"
              -schema-location default
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')
          echo "::group::socle"
          helm template socle plateforme/helm/socle -n argocd \
            --set courrielAcme=ci@example.org --set 'applications={paie,pilotage,procurement}' \
            | "${KC[@]}" -
          echo "::endgroup::"
          for f in plateforme/helm/application/ci/*.yaml; do
            echo "::group::application · $f"
            helm template ci plateforme/helm/application -n ci -f "$f" | "${KC[@]}" -
            echo "::endgroup::"
          done
          # Les VRAIES valeurs de production. L'image et le Secret sont posés
          # pour le rendu : ils manquent tant que la CI n'a rien publié.
          for d in gitops/applications/*/; do
            app="$(basename "$d")"
            echo "::group::gitops · $app"
            helm template "$app" plateforme/helm/application -n "$app" -f "$d/values.yaml" \
              --set image.tag=ci --set frontend.image.tag=ci --set secrets.existant=ci \
              | "${KC[@]}" -
            echo "::endgroup::"
          done

  securite:
    name: sécurité (trivy, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # publier les résultats dans « Code scanning »
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: trivy (somme vérifiée)
        run: |
          curl -sSfL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar xzf /tmp/trivy.tgz -C /usr/local/bin trivy

      - name: trivy — secrets committés par erreur (bloquant)
        run: trivy fs --scanners secret --exit-code 1 --no-progress .

      - name: trivy — mauvaises configurations Terraform, Helm, Kubernetes
        run: |
          # Rapport complet pour l'onglet Security…
          trivy config --format sarif --output trivy-config.sarif \
            --helm-values plateforme/helm/application/ci/proxy-values.yaml plateforme/
          # … et BLOQUANT sur HIGH/CRITICAL, avec les exceptions justifiées
          # dans .trivyignore.yaml.
          trivy config --severity HIGH,CRITICAL --exit-code 1 \
            --helm-values plateforme/helm/application/ci/proxy-values.yaml \
            --ignorefile plateforme/.trivyignore.yaml plateforme/

      - name: publier dans Code scanning
        if: always() && hashFiles('trivy-config.sarif') != ''
        # Code scanning sur un dépôt PRIVÉ demande GitHub Advanced Security.
        # Sans lui, l'envoi échoue : ce n'est pas bloquant, le contrôle
        # BLOQUANT est l'étape précédente.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: zizmor — sécurité de TOUS les workflows GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run zizmor==1.30.1 --min-severity medium .github/workflows/ .github/actions/

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x plateforme/amorcage/*.sh plateforme/outils/*.sh plateforme/labo/*.sh

  # Le seul contrôle à rendre OBLIGATOIRE dans les règles de `main` :
  # il échoue si l'un des travaux ci-dessus a échoué ou a été annulé.
  garde:
    name: garde (qualité)
    if: always()
    needs: [terraform, helm, securite, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: tous les travaux sont verts
        env:
          RESULTATS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "résultats : $RESULTATS"
          if echo "$RESULTATS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::un contrôle de qualité a échoué"
            exit 1
          fi
