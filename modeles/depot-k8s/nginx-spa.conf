# nginx de l'écran : une application à page unique (SPA).
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Les fichiers bâtis portent une empreinte dans leur nom : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Toute autre adresse renvoie index.html : le routeur de l'écran décide.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
