{{- /* =====================================================================
       Sealed Secrets, installé PAR Argo CD (et non par Terraform).

       Pourquoi ?  Le contrôleur garde la CLÉ PRIVÉE qui déchiffre tous les
       secrets du dépôt. Si Terraform l'installait, le compte terraform-plan
       (utilisé sur chaque PR) devrait lire les Secrets de son espace pour
       relire la release Helm — et pourrait donc lire la clé. Ici, l'espace
       sealed-secrets n'est lisible que par Argo CD et root.

       Le nom « sealed-secrets-controller » est celui que kubeseal cherche
       par défaut : pas d'option à passer à chaque commande.
       ===================================================================== */ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: {{ .Release.Namespace }}
spec:
  project: plateforme
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: {{ .Values.sealedSecrets.version | quote }}
    helm:
      releaseName: sealed-secrets-controller
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        metrics:
          serviceMonitor:
            enabled: {{ .Values.observabilite }}
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: plateforme
        plateforme.entreprisetools/type: socle
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
