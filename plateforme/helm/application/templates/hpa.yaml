{{- if .Values.autoscaling.actif }}
{{- if .Values.volumes }}{{ fail "autoscaling et volumes ReadWriteOnce sont incompatibles : plusieurs pods écriraient le même volume" }}{{ end -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "application.nom" . }}
  labels:
    {{- include "application.etiquettes" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "application.nom" . }}
  minReplicas: {{ .Values.autoscaling.minimum }}
  maxReplicas: {{ .Values.autoscaling.maximum }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.cpuCible }}
{{- end }}
