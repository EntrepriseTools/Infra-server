{{- /* Un compte de service PAR application, sans aucun droit sur l'API et
       sans jeton monté : le code de l'application n'a rien à demander à
       Kubernetes. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "application.nom" . }}
  labels:
    {{- include "application.etiquettes" . | nindent 4 }}
automountServiceAccountToken: false
