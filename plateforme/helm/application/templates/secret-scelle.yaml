{{- /* Les secrets de l'application, CHIFFRÉS pour ce cluster.
       Le contrôleur Sealed Secrets (espace sealed-secrets) est le seul à
       détenir la clé privée : il déchiffre et crée le Secret <nom>-secrets.
       Portée « strict » : le chiffré ne vaut QUE pour ce nom ET cet espace —
       copié dans une autre application, il est inutilisable. */ -}}
{{- if and .Values.secrets.scelles (not .Values.secrets.existant) }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "application.secret" . }}
  labels:
    {{- include "application.etiquettes" . | nindent 4 }}
spec:
  encryptedData:
    {{- range $cle, $chiffre := .Values.secrets.scelles }}
    {{ $cle }}: {{ $chiffre | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ include "application.secret" . }}
      labels:
        {{- include "application.etiquettes" . | nindent 8 }}
    type: Opaque
{{- end }}
