# =====================================================================
# Rail (paas/) : tests, lint des scripts, configuration Compose valide.
# =====================================================================
name: paas

on:
  push:
    branches: [main]
    paths: ["paas/**", ".github/workflows/paas.yml"]
  pull_request:
    branches: [main]
    paths: ["paas/**", ".github/workflows/paas.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests du plan de contrôle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Node 22 par l'image officielle : pas d'action tierce de plus à épingler.
    container: node:22-bookworm
    defaults:
      run:
        working-directory: paas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tests (git réel, Docker simulé, HTTP réel)
        run: npm test
      - name: Le tableau de bord se lit (syntaxe des modules du navigateur)
        run: npm run check

  scripts:
    name: install.sh et Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x paas/install.sh paas/sauvegarde.sh paas/test/integration.sh
      - name: Compose
        working-directory: paas
        run: |
          sed -e 's|^DOCKER_GID=.*|DOCKER_GID=999|' .env.example > .env
          cp traefik.exemple.yml traefik.local.yml   # engendré par install.sh sur une vraie machine
          : > .env.dns
          docker compose config --quiet
          # Les ports sont réglables : derrière un nginx, Rail n'expose que son port HTTP.
          RAIL_TLS=proxy RAIL_HTTP_PORT=8080 RAIL_BIND_TLS=127.0.0.1 RAIL_HTTPS_PORT=8443 \
            docker compose config | grep -q 'published: "8080"'
      - name: L'image du plan de contrôle se construit
        working-directory: paas
        run: docker build -t rail-control:ci .

  integration:
    name: déploiement réel contre le Docker de la machine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Le plan de contrôle tourne dans son image, parle au vrai démon Docker,
      # déploie une vraie base PostgreSQL, la mesure, la sauvegarde et la supprime.
      - name: Déployer pour de vrai
        working-directory: paas
        run: ./test/integration.sh
