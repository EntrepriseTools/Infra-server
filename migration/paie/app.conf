# Manifeste de la PAIE (dépôt HR_Management) — à poser en deploiement/app.conf.
# Traduit fidèlement de deploiement/docker-compose.yml + paie.sh (voie conteneur).
APP=paie
IMAGE=hr/paie
SERVICE=paie
MODE_WEB=proxy
# `/` répond depuis le disque même base morte : seule /api/moi prouve la base.
SONDES="/ /api/moi"
SONDE_PUBLIQUE=/
VARIABLE_PORT=PAIE_PORT
VARIABLE_ADRESSE=PAIE_ADRESSE
# Mêmes noms que l'ancien compose, sous le projet « hr » (--projet hr) :
# les volumes hr_paie-etat et hr_paie-journaux sont REPRIS, pas recréés — la
# supervision continue de lire hr_paie-journaux.
VOLUMES="paie-etat:/var/lib/paie paie-journaux:/var/lib/paie/journaux"
# L'ancien compose n'avait pas de plafond : la JVM voyait la machine entière.
MEMOIRE=2g
CORPS_MAX=32m
DELAI_PROXY=120
BASE_VARIABLES="PAIE_BASE=@JDBC@ PAIE_UTILISATEUR=@ROLE@ PAIE_MOTDEPASSE=@MOTDEPASSE@"
SECRETS=""
VARIABLES_FIXES="PAIE_URL_PUBLIQUE=@URL@"
VARIABLES_OBLIGATOIRES="PAIE_BASE PAIE_UTILISATEUR PAIE_MOTDEPASSE"
