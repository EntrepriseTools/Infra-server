# =====================================================================
# Le MANIFESTE de « __APP__ » pour « infra » (Infra-server).
#
# Il décrit ce qui dépend du CODE ; ce qui dépend du SERVEUR (port, nom
# public, compte, base, heure de sauvegarde) est dans la fiche serveur,
# /etc/infra/apps/__APP__.conf, qu'écrit « infra creer ».
#
# Livré avec chaque déploiement et VALIDÉ clé par clé sur le serveur : une
# clé inconnue, un chemin de l'hôte dans VOLUMES, un « ; » — refusés.
# Syntaxe : CLE=valeur, listes séparées par des espaces entre guillemets.
# Référence complète : Infra-server/README.md, « Le manifeste ».
# =====================================================================

# Le nom de l'application sur le serveur (a-z, 0-9, tiret).
APP=__APP__
# L'image que le pipeline bâtit (sans étiquette : l'étiquette est le SHA).
IMAGE=__EQUIPE__/__APP__
# Le nom du service dans le compose engendré.
SERVICE=app

# proxy : l'application sert tout (écran + API) — nginx renvoie « / ».
# spa   : nginx sert l'écran bâti, et renvoie API_PREFIXE à l'application.
MODE_WEB=__MODE__
API_PREFIXE=/api/

# Sondées sur 127.0.0.1:<port> après la relance ; TOUTES doivent rendre 200,
# sinon retour arrière. Mettre en dernier une sonde qui touche la BASE.
SONDES="/actuator/health"
# Sondée par le nom public, derrière nginx.
SONDE_PUBLIQUE=/

# Les variables par lesquelles l'application reçoit son port et son adresse
# d'écoute (Spring Boot : SERVER_PORT / SERVER_ADDRESS).
VARIABLE_PORT=SERVER_PORT
VARIABLE_ADRESSE=SERVER_ADDRESS

# Volumes NOMMÉS seulement :  "nom:/chemin/dans/le/conteneur autre:/…"
VOLUMES=""
MEMOIRE=1g
CORPS_MAX=16m
DELAI_PROXY=120

# Comment l'application lit sa base — rendu UNE fois par « infra creer » dans
# les secrets. Jetons : @JDBC@ @HOTE@ @PORT_BASE@ @BASE@ @ROLE@ @MOTDEPASSE@
BASE_VARIABLES="SPRING_DATASOURCE_URL=@JDBC@ SPRING_DATASOURCE_USERNAME=@ROLE@ SPRING_DATASOURCE_PASSWORD=@MOTDEPASSE@"
# Secrets tirés au sort par « infra creer » : hex:N, base64:N, mdp:N
SECRETS="JWT_SECRET=base64:64"
# Posées dans l'environnement du conteneur à chaque déploiement.
# Jetons : @URL@ @NOM@ @HTTPS@ (true/false) @PORT@
VARIABLES_FIXES="SPRING_PROFILES_ACTIVE=prod"
# Refus de déployer si l'une d'elles est vide dans les secrets.
VARIABLES_OBLIGATOIRES="SPRING_DATASOURCE_URL SPRING_DATASOURCE_PASSWORD JWT_SECRET"
