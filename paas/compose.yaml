# Rail : Traefik (HTTPS + routage) et le plan de contrôle.
# Les services des utilisateurs, eux, sont lancés par le plan de contrôle sur le réseau « rail ».
name: rail

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    # Toute la configuration statique est dans un fichier engendré par install.sh :
    # c'est lui qui décide des certificats (Let's Encrypt par HTTP-01, par DNS-01,
    # ou rien du tout quand un proxy devant fait déjà le HTTPS).
    volumes:
      - ./traefik.local.yml:/etc/traefik/traefik.yml:ro
      - rail-data:/data:ro
      - traefik-acme:/letsencrypt
    # Les ports PUBLIÉS sur la machine ; à l'intérieur, Traefik écoute toujours 80 et 443.
    ports:
      - "${RAIL_BIND:-0.0.0.0}:${RAIL_HTTP_PORT:-80}:80"
      # En mode « proxy », install.sh met RAIL_BIND_TLS=127.0.0.1 : rien d'exposé,
      # et aucun conflit avec le serveur qui tient déjà le 443 de la machine.
      - "${RAIL_BIND_TLS:-${RAIL_BIND:-0.0.0.0}}:${RAIL_HTTPS_PORT:-443}:443"
    # Les identifiants du fournisseur DNS (mode RAIL_TLS=dns), et rien d'autre.
    env_file:
      - .env.dns
    networks: [rail]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Le dossier des routes doit exister avant que Traefik ne le surveille.
    depends_on:
      control: { condition: service_healthy }

  control:
    build: .
    image: rail-control:local
    container_name: rail-control
    restart: unless-stopped
    env_file: .env
    environment:
      RAIL_NETWORK: rail
    # Le compte « node » du conteneur rejoint le groupe propriétaire du socket docker de l'hôte.
    user: node
    group_add: ["${DOCKER_GID:?DOCKER_GID manquant dans .env (install.sh le renseigne)}"]
    volumes:
      - rail-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [rail]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  rail-data:
  traefik-acme:

networks:
  rail:
    name: rail
