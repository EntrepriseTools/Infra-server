apiVersion: v1
kind: Service
metadata:
  name: {{ include "application.nom" . }}
  labels:
    {{- include "application.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "application.selecteur" (dict "racine" . "composant" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
