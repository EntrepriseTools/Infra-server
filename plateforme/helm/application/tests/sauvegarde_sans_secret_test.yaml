# Une suite à part : les valeurs `set` d'une suite se FUSIONNENT avec celles
# de chaque test, on ne peut donc pas y « retirer » les secrets.
suite: la sauvegarde exige un Secret
templates:
  - sauvegarde.yaml
set:
  image.tag: abc1234
  ingress.hote: app.example.org
  sauvegardeAvantDeploiement.base: app
  sauvegardeAvantDeploiement.utilisateur.valeur: app
  sauvegardeAvantDeploiement.motDePasse.cle: DB_MOTDEPASSE
tests:
  - it: refuse de rendre sans Secret où lire le mot de passe
    asserts:
      - failedTemplate:
          errorPattern: "demande un Secret"

  - it: accepte un Secret existant et un utilisateur en clair
    set:
      secrets.existant: app-secrets
    documentIndex: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            value: app
