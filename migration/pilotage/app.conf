# Manifeste de PILOTAGE (dépôt board) — à poser en deploiement/app.conf.
# Traduit fidèlement de deploiement/docker-compose.yml + pilotage.sh.
APP=pilotage
IMAGE=board/pilotage
SERVICE=pilotage
MODE_WEB=proxy
# `/` prouve Spring ; /actuator/health passe à 503 dès que la base se tait.
SONDES="/ /actuator/health"
SONDE_PUBLIQUE=/actuator/health
VARIABLE_PORT=SERVER_PORT
VARIABLE_ADRESSE=SERVER_ADDRESS
VOLUMES=""
MEMOIRE=1g
CORPS_MAX=12m
DELAI_PROXY=120
BASE_VARIABLES="DATABASE_URL=@JDBC@ DATABASE_USER=@ROLE@ DATABASE_PASSWORD=@MOTDEPASSE@"
# AUTH_SECRET : 32 caractères au moins, jamais le secret de développement.
SECRETS="AUTH_SECRET=hex:32 ADMIN_PASSWORD=mdp:20"
# pilotage.sh refusait https + cookie non sécurisé (et l'inverse) : le jeton
# @HTTPS@ rend l'incohérence impossible.
VARIABLES_FIXES="COOKIE_SECURISE=@HTTPS@"
VARIABLES_OBLIGATOIRES="DATABASE_URL DATABASE_USER DATABASE_PASSWORD AUTH_SECRET"
