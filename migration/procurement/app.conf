# Manifeste de PROCUREMENT (dépôt Purchase_Management) — à poser en
# deploiement/app.conf. Traduit de deploiement/docker-compose.yml + procurement.sh.
APP=procurement
IMAGE=procurement/backend
SERVICE=backend
# nginx sert l'écran bâti, /api/ va au backend (même origine, pas de CORS).
MODE_WEB=spa
API_PREFIXE=/api/
SONDES="/actuator/health"
SONDE_PUBLIQUE=/
VARIABLE_PORT=PORT
VARIABLE_ADRESSE=SERVER_ADDRESS
VOLUMES=""
MEMOIRE=1g
CORPS_MAX=12m
# Le tableau de bord IA répond en flux (SSE).
DELAI_PROXY=300
BASE_VARIABLES="PGHOST=@HOTE@ PGPORT=@PORT_BASE@ PGDATABASE=@BASE@ PGUSER=@ROLE@ PGPASSWORD=@MOTDEPASSE@"
SECRETS="JWT_SECRET=base64:64"
# OLLAMA_CHAT_ENABLED reste dans les secrets (false par défaut côté appli).
VARIABLES_FIXES="SPRING_PROFILES_ACTIVE=prod CORS_ALLOWED_ORIGINS=@URL@"
VARIABLES_OBLIGATOIRES="PGDATABASE PGUSER PGPASSWORD JWT_SECRET"
